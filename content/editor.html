<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>רגע · עריכת תוכן</title><style>body{font:17px system-ui;max-width:1000px;margin:32px auto;padding:20px;background:#f7f8fc;color:#182039}input,select,textarea,button{font:inherit;padding:10px;max-width:100%;box-sizing:border-box}textarea{width:100%;min-height:75px}label{display:block;margin:15px 0}section{background:white;border:1px solid #ddd;border-radius:16px;padding:24px;margin:20px 0}button{cursor:pointer;margin:8px}#rows button{display:block;text-align:right;width:100%}.checks label{display:flex;gap:10px}#message{white-space:pre-wrap}</style>
<h1>עורך התוכן של רגע</h1><p>פותחים את קובץ הקטלוג, עורכים ושומרים עותק. אישור דורש בדיקת המקור והשפה. השמירה אינה מפרסמת לאפליקציה.</p><label>פתיחת קטלוג<input id="load" type="file" accept="application/json"></label><button id="download" disabled>הורדת הקטלוג המעודכן</button><button id="new" disabled>מועמד חדש</button><input id="search" placeholder="חיפוש כותרת או מזהה" aria-label="חיפוש"><select id="filter" aria-label="מצב"><option value="">כל המצבים</option><option>draft</option><option>approved</option><option>rejected</option></select><p role="status" id="message"></p><section id="form" hidden></section><section id="rows"></section>
<script type="module">
let catalog,selected;const q=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function list(){if(!catalog)return;q('#rows').innerHTML=catalog.facts.filter(f=>(!q('#filter').value||f.workflow===q('#filter').value)&&(f.id+' '+f.title).includes(q('#search').value)).map(f=>`<button data-id="${e(f.id)}">${e(f.workflow)} · ${e(f.title||f.id)}</button>`).join('');}
function edit(f){selected=f;q('#form').hidden=false;const fields=['id','title','shortFact','summary','explanation','whyItMatters','example','category','subcategory','dateVerified','nextReviewAt','verificationNote'];q('#form').innerHTML=fields.map(k=>`<label>${k}<textarea data-field="${k}">${e(f[k]||'')}</textarea></label>`).join('')+`<label>מקורות JSON<textarea id="sources">${e(JSON.stringify(f.sources||[],null,2))}</textarea></label><label>סיווג<select id="freshness"><option ${f.freshness==='evergreen'?'selected':''}>evergreen</option><option ${f.freshness==='timeSensitive'?'selected':''}>timeSensitive</option></select></label><label>ודאות<select id="verification"><option ${f.verificationStatus==='sourceChecked'?'selected':''}>sourceChecked</option><option ${f.verificationStatus==='qualified'?'selected':''}>qualified</option></select></label><label>שם הבודק<input id="reviewer" value="${e(f.review?.reviewer||'')}"></label><label>מה במקור תומך בטענה? (סעיף או הערת בדיקה)<textarea id="evidence">${e(f.review?.evidence||'')}</textarea></label><label>סיבת תיקון לפריט שכבר פורסם<input id="correction"></label><div class="checks"><label><input id="checked" type="checkbox">פתחתי את המקור ובדקתי את הטענה</label><label><input id="plain" type="checkbox">בדקתי שהניסוח פשוט ומדויק</label></div><button data-save="draft">שמירת טיוטה</button><button data-save="approved">אישור לפרסום</button><button data-save="rejected">דחייה</button>`;q('#form').scrollIntoView();}
q('#load').onchange=async ev=>{try{const f=ev.target.files[0];if(f.size>15000000)throw Error('הקובץ גדול מדי');const data=JSON.parse(await f.text());if(data.schema!==1||!Array.isArray(data.facts)||!Array.isArray(data.categories))throw Error('קטלוג לא תקין');catalog=data;list();q('#download').disabled=q('#new').disabled=false;}catch(err){q('#message').textContent=err.message;}};
q('#search').oninput=q('#filter').onchange=list;
q('#new').onclick=()=>{const f={id:'draft-'+crypto.randomUUID(),workflow:'draft',freshness:'evergreen',difficulty:'easy',kind:'surprise',tags:[],createdAt:new Date().toISOString().slice(0,10)};catalog.facts.push(f);edit(f);};
document.onclick=ev=>{const id=ev.target.dataset.id;if(id)edit(catalog.facts.find(f=>f.id===id));const status=ev.target.dataset.save;if(!status)return;try{const next={...selected};q('#form').querySelectorAll('[data-field]').forEach(t=>next[t.dataset.field]=t.value.trim());next.sources=JSON.parse(q('#sources').value);next.freshness=q('#freshness').value;next.verificationStatus=q('#verification').value;next.workflow=status;next.updatedAt=new Date().toISOString().slice(0,10);next.review={reviewer:q('#reviewer').value.trim(),evidence:q('#evidence').value.trim(),sourceChecked:q('#checked').checked,plainLanguageChecked:q('#plain').checked,reviewedAt:next.updatedAt};if(status==='approved'&&(!next.review.sourceChecked||!next.review.plainLanguageChecked||!next.review.reviewer||!next.review.evidence||!next.sources.length||!next.dateVerified))throw Error('נדרשים מקור, תאריך וכל שדות הבדיקה');if(selected.workflow==='approved'&&JSON.stringify(next)!==JSON.stringify(selected)){if(!q('#correction').value.trim())throw Error('יש לציין סיבה לשינוי בפריט מאושר');next.corrections=[...(selected.corrections||[]),{date:next.updatedAt,reason:q('#correction').value.trim()}];}if(catalog.facts.some(f=>f!==selected&&f.id===next.id))throw Error('מזהה כפול');Object.assign(selected,next);q('#message').textContent='נשמר בזיכרון העורך. יש להוריד את הקטלוג כדי לשמור לקובץ.';list();}catch(err){q('#message').textContent=err.message;}};
q('#download').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(catalog,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='catalog.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),10000);};
</script></html>
